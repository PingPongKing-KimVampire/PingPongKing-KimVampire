version: "3.8"

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - vampire

  web:
    build: ./BE
    expose:
      - "3001"
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - vampire
    volumes:
      - image_data:/app/image

  nginx:
    build: ./FE
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    networks:
      - vampire

networks:
  vampire:
    driver: bridge

volumes:
  postgres_data:
  image_data: